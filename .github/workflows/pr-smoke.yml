name: PR comment checks
run-name: >-
  PR #${{ github.event.issue.number }} ${{ contains(fromJSON('["/smoke","/ocr-check","/migration-check","/preview"]'), github.event.comment.body) && github.event.comment.body || '댓글 검사' }}

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["/smoke","/ocr-check","/migration-check","/preview"]'), github.event.comment.body) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      command: ${{ steps.pr.outputs.command }}
    steps:
      - name: Confirm maintainer permission and capture the PR commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          author=$(jq -er '.comment.user.login' "$GITHUB_EVENT_PATH")
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$author/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *) echo 'Only maintainers can run PR comment checks.'; exit 0 ;;
          esac
          command=$(jq -er '.comment.body' "$GITHUB_EVENT_PATH")
          case "$command" in
            /smoke|/ocr-check|/migration-check|/preview) ;;
            *) exit 0 ;;
          esac
          number=$(jq -er '.issue.number' "$GITHUB_EVENT_PATH")
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq 'select(.base.ref == "main") | .head.sha')
          [[ "$number" =~ ^[0-9]+$ && "$head" =~ ^[0-9a-f]{40}$ ]]
          printf 'number=%s\nhead=%s\ncommand=%s\n' "$number" "$head" "$command" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ fromJSON('{"/smoke":"가상 스터디 브라우저 검증","/ocr-check":"OCR 판정 비교","/migration-check":"가상 DB 마이그레이션 비교","/preview":"PC 및 모바일 화면 비교"}')[needs.authorize.outputs.command] }}
    needs: authorize
    if: needs.authorize.outputs.head != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ needs.authorize.outputs.number }}
      PR_HEAD: ${{ needs.authorize.outputs.head }}
      PR_COMMAND: ${{ needs.authorize.outputs.command }}
      ARTIFACT_NAME: ${{ fromJSON('{"/smoke":"smoke-failure","/ocr-check":"ocr-comparison","/migration-check":"migration-comparison","/preview":"preview-comparison"}')[needs.authorize.outputs.command] }}
    steps:
      - name: Prepare isolated paths
        run: |
          printf 'CHECK_RESULTS=%s/puli-check-results\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PR_SOURCE=%s/puli-pr-source\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CHECK_ARTIFACTS=%s/puli-check-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies from the default branch
        run: npm ci --no-audit --no-fund
      - name: Prepare the shared browser OCR engine
        if: env.PR_COMMAND == '/ocr-check'
        run: npm run build:ocr
      - name: Fetch the requested PR source without executing it
        run: |
          git fetch --no-tags --depth=1 origin "refs/pull/$PR_NUMBER/head"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$PR_HEAD" ]]; then
            echo 'PR head changed. Run the comment command again for the latest commit.'
            exit 1
          fi
          mkdir -p "$PR_SOURCE" "$CHECK_RESULTS"
          git archive FETCH_HEAD | tar -xf - -C "$PR_SOURCE"
      - name: Run the requested check in an isolated container
        run: |
          case "$PR_COMMAND" in
            /smoke) script=smoke.mjs ;;
            /ocr-check) script=ocr-check.mjs ;;
            /migration-check) script=migration-check.mjs ;;
            /preview) script=preview.mjs ;;
            *) exit 1 ;;
          esac
          docker run --rm --init --network none --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 3g --shm-size 256m \
            --tmpfs /tmp:rw,exec,nosuid,nodev,mode=1777,size=1g \
            --env HOME=/tmp --env PULI_SMOKE_RESULTS=/results --env PULI_OCR_RESULTS=/results \
            --env PULI_MIGRATION_RESULTS=/results --env PULI_PREVIEW_RESULTS=/results --env WRANGLER_SEND_METRICS=false \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/trusted,readonly" \
            --mount "type=bind,src=$PR_SOURCE,dst=/candidate,readonly" \
            --mount "type=bind,src=$CHECK_RESULTS,dst=/results" \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            node "/trusted/scripts/$script" /candidate > "$CHECK_RESULTS/run.log" 2>&1
      - name: Show check results
        if: always()
        run: |
          printf 'PR #%s, commit `%s`\n\n' "$PR_NUMBER" "$PR_HEAD" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PR_COMMAND" != '/smoke' ]]; then
            printf 'main 기준 커밋 `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
          summary="$CHECK_RESULTS/summary.md"
          log="$CHECK_RESULTS/run.log"
          if [[ -f "$summary" && ! -L "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '단계 결과가 생성되지 않았습니다. 실행 로그를 확인하세요.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$log" && ! -L "$log" ]]; then
            stop=$(cat /proc/sys/kernel/random/uuid)
            printf '::stop-commands::%s\n' "$stop"
            tail -c 12000 "$log"
            printf '\n::%s::\n' "$stop"
          fi
      - name: Collect report files
        if: always() && (env.PR_COMMAND != '/smoke' || failure())
        run: |
          mkdir -p "$CHECK_ARTIFACTS"
          files=(failure.png run.log)
          if [[ "$PR_COMMAND" != '/smoke' ]]; then files+=(comparison.json); fi
          if [[ "$PR_COMMAND" == '/migration-check' || "$PR_COMMAND" == '/preview' ]]; then files+=(summary.md); fi
          if [[ "$PR_COMMAND" == '/ocr-check' || "$PR_COMMAND" == '/preview' ]]; then
            files+=(report.html)
            for image in "$CHECK_RESULTS"/*.png; do
              name=${image##*/}
              if [[ "$name" =~ ^[a-z0-9-]+\.png$ ]]; then files+=("$name"); fi
            done
          fi
          for name in "${files[@]}"; do
            file="$CHECK_RESULTS/$name"
            if [[ -f "$file" && ! -L "$file" ]]; then
              cp -- "$file" "$CHECK_ARTIFACTS/$name"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (env.PR_COMMAND != '/smoke' || failure())
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.CHECK_ARTIFACTS }}/
          if-no-files-found: ignore
          retention-days: 7
